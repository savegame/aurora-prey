// Default game controller bindings, installed with the game.
//
// Read at startup after preyconfig.cfg and only for the keys that are
// still unbound there: whatever a controller key is bound to in the
// Controls menu, preyconfig.cfg or autoexec.cfg stays. autoexec.cfg runs
// after this file, so "unbind JOY5" there keeps a key unbound for good.
// Only bindings belong in this file.
//
// Keys: JOY1 A, JOY2 B, JOY3 X, JOY4 Y, JOY5 Back, JOY6 Guide, JOY7 Start,
// JOY8 left stick click, JOY9 right stick click, JOY10 left shoulder,
// JOY11 right shoulder, JOY12 D-pad up, JOY13 D-pad down, JOY14 D-pad left,
// JOY15 D-pad right, JOY16 misc (share), JOY17..JOY20 paddles,
// JOY21 touchpad, JOY23 left trigger, JOY24 right trigger.
// Start is always Escape (menu, skip cinematic) and can't be bound.
// The sticks move and look, see joy_deadZone, joy_lookSpeed, joy_invertY.

bind JOY1 "_moveup"		// A: jump
bind JOY2 "_movedown"		// B: crouch
bind JOY3 "_impulse54"		// X: spirit walk
bind JOY4 "_impulse16"		// Y: lighter
bind JOY5 "togglehelp"		// Back: help
bind JOY8 "_impulse18"		// left stick click: center view
bind JOY9 "_movedown"		// right stick click: crouch
bind JOY10 "_impulse15"		// left shoulder: previous weapon
bind JOY11 "_impulse14"		// right shoulder: next weapon
bind JOY12 "_impulse25"		// D-pad up: throw a crawler grenade
bind JOY13 "_impulse1"		// D-pad down: wrench
bind JOY14 "savegame quick"	// D-pad left: quick save
bind JOY15 "loadgame quick"	// D-pad right: quick load
bind JOY23 "_attackalt"		// left trigger: alternate fire, rifle zoom
bind JOY24 "_attack"		// right trigger: fire, use
